<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Garden for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Kalam:wght@300;400&family=Quicksand:wght@400;600&display=swap">
</head>
<body style="margin:0">
<style>
/* Layout: one night-garden screen; a gift in the middle, six small things scattered around it to tap. */
:root {
  --sky-top: #191630;
  --sky-low: #3b2546;
  --petal: #f2a3b6;
  --petal-deep: #d9738f;
  --lantern: #f5d38a;
  --leaf: #7fae8a;
  --paper: #fbf3e6;
  --ink: #3a2a38;
  --ink-soft: #7a6474;
  --mist: rgba(251, 243, 230, .72);
  --f-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --f-ui: "Quicksand", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky-top);
  color: var(--paper);
  font-family: var(--f-ui);
  overflow: hidden;
}
.scene {
  position: relative;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(120% 60% at 50% 110%, #5a3350 0%, transparent 60%),
    radial-gradient(60% 40% at 80% 0%, #2a2350 0%, transparent 70%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 100%);
}
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.hill {
  position: absolute; left: -10%; right: -10%; bottom: -8%; height: 26%;
  background: radial-gradient(70% 100% at 50% 100%, #2c1d33 0%, #241a2e 60%, transparent 61%);
}
.firefly {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: var(--lantern); box-shadow: 0 0 10px 3px rgba(245, 211, 138, .55);
  opacity: .0; animation: drift 9s ease-in-out infinite;
}
@keyframes drift {
  0% { transform: translate(0, 0); opacity: 0; }
  20% { opacity: .9; }
  50% { transform: translate(30px, -40px); opacity: .5; }
  80% { opacity: .9; }
  100% { transform: translate(-10px, -80px); opacity: 0; }
}

/* headline */
.top {
  position: absolute; z-index: 3; top: 0; left: 0; right: 0;
  padding-block: clamp(18px, 4vh, 40px) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; pointer-events: none;
}
.top h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(30px, 6vw, 54px); line-height: 1.05; text-wrap: balance;
}
.top h1 em { color: var(--petal); }
.top p {
  margin: .5em auto 0; max-width: 32ch; font-size: clamp(13px, 1.8vw, 16px);
  color: var(--mist); text-wrap: balance; transition: opacity .6s;
}

/* stage holds every tappable thing */
.stage {
  position: absolute; z-index: 2;
  top: 0; bottom: 0;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
}
.thing {
  position: absolute; left: var(--x); top: var(--y);
  transform: translate(-50%, -50%);
  width: var(--s, clamp(56px, min(15vmin, 13vh), 128px));
  display: grid; justify-items: center; gap: 4px;
  background: none; border: 0; padding: 0; color: inherit; cursor: pointer;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .8s ease, transform .5s cubic-bezier(.3, 1.4, .5, 1);
}
.thing svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .35)); }
.thing .label {
  font-size: 12px; letter-spacing: .08em; text-transform: lowercase;
  color: var(--mist); white-space: nowrap;
  justify-self: start; position: relative; left: 50%; transform: translateX(-50%);
  padding: 2px 9px; border-radius: 99px; background: rgba(25, 22, 48, .45);
}
.thing:hover, .thing:focus-visible { transform: translate(-50%, -50%) scale(1.08) rotate(-2deg); }
.thing:focus-visible { outline: none; }
.thing:focus-visible .label { outline: 2px solid var(--lantern); outline-offset: 2px; }
/* tall phone screens: give the lower row more room */
@media (max-aspect-ratio: 3/4) {
  .gift { --y: 52% !important; }
  [data-item="flowers"], [data-item="food"] { --y: 71.5% !important; }
  [data-item="jar"] { --y: 86% !important; }
}
.thing.seen .label::after { content: " ✓"; color: var(--leaf); }
.thing.hiddenitem { opacity: 0; pointer-events: none; transform: translate(-50%, -30%) scale(.8); }
.thing .bob { animation: bob 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 50% { transform: translateY(-6px); } }

.gift { --s: clamp(110px, min(34vmin, 30vh), 260px); }
.gift .lid { transition: transform .9s cubic-bezier(.4, -0.3, .3, 1.3); transform-box: fill-box; transform-origin: 50% 100%; }
.gift.open .lid { transform: translate(16px, -40px) rotate(14deg); }
.gift .glow { opacity: 0; transition: opacity 1s; }
.gift.open .glow, .gift.final .glow { opacity: 1; }
.gift.final .glow { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.gift:not(.open) svg { animation: wiggle 3.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }

.wing { transform-box: fill-box; animation: flap .5s ease-in-out infinite alternate; }
.wing.l { transform-origin: 100% 50%; }
.wing.r { transform-origin: 0% 50%; }
@keyframes flap { to { transform: scaleX(.35); } }
.flutter { animation: flutter 7s ease-in-out infinite; }
@keyframes flutter { 25% { transform: translate(8px, -10px) rotate(6deg); } 50% { transform: translate(-6px, -4px) rotate(-4deg); } 75% { transform: translate(4px, 8px) rotate(3deg); } }
.cake-bounce { transform-box: fill-box; transform-origin: 50% 100%; animation: cakebounce 1.8s ease-in-out infinite; }
@keyframes cakebounce { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.08, .9); } 30% { transform: translateY(-9px) scale(.95, 1.06); } 45% { transform: translateY(0) scale(1.05, .94); } }
.steam { animation: steam 3s ease-in-out infinite; opacity: .0; }
.steam.s2 { animation-delay: 1.4s; }
@keyframes steam { 0% { transform: translateY(6px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-14px); opacity: 0; } }

.counter {
  position: absolute; z-index: 3; bottom: 0; left: 0; right: 0;
  padding-block: 0 max(14px, 2.5vh);
  text-align: center; font-size: 13px; letter-spacing: .06em; color: var(--mist);
  opacity: 0; transition: opacity .8s;
}
.counter.on { opacity: 1; }
.counter button {
  font: 600 14px var(--f-ui); letter-spacing: .04em; cursor: pointer; color: var(--sky-top);
  background: var(--lantern); border: 0; border-radius: 99px; padding: 10px 18px;
  box-shadow: 0 0 24px rgba(245, 211, 138, .45); animation: pulse 2.4s ease-in-out infinite;
}
.counter button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

/* paper note overlay */
.veil {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(16, 12, 30, .62);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .35s;
}
.veil.on { opacity: 1; pointer-events: auto; }
.note {
  position: relative; width: min(100%, 34rem); max-height: calc(100dvh - 48px); overflow: auto;
  background: var(--paper); color: var(--ink);
  border-radius: 4px; padding: clamp(24px, 5vw, 44px);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6);
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(217, 115, 143, .14) 31px 32px);
  background-position: 0 12px;
  transform: translateY(24px) rotate(-1deg) scale(.96); transition: transform .45s cubic-bezier(.3, 1.3, .5, 1);
}
.veil.on .note { transform: none; }
.note .kicker {
  font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--petal-deep); margin: 0 0 6px;
}
.note h2 {
  font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 5vw, 38px);
  line-height: 1.1; margin: 0 0 14px; text-wrap: balance;
}
.note .body { font-family: var(--f-hand); font-size: clamp(17px, 2.4vw, 19px); line-height: 32px; }
.note .body p { margin: 0 0 32px; }
.note .body p:last-child { margin-bottom: 0; }
.note .poem { text-align: center; }
.note .poem-intro { font-style: italic; color: var(--ink-soft); text-align: center; }
.note.is-poem h2 { text-align: center; }
.note .body p.wish { text-align: center; font-size: 1.12em; color: var(--ink); text-wrap: balance; }
.quizpill {
  position: absolute; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px));
  font: 600 12px var(--f-ui); letter-spacing: .06em; cursor: pointer;
  color: var(--paper); background: rgba(25, 22, 48, .55); border: 1px solid rgba(245, 211, 138, .55);
  border-radius: 99px; padding: 8px 12px; display: inline-flex; align-items: center; gap: 6px;
  animation: fadeUp .6s both;
}
.soundbtn {
  position: absolute; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(14px, env(safe-area-inset-left, 0px));
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
  color: var(--lantern); background: rgba(25, 22, 48, .55); border: 1px solid rgba(245, 211, 138, .55);
  animation: fadeUp .6s both;
}
.soundbtn svg { width: 20px; height: 20px; }
.soundbtn .cross { display: none; }
.soundbtn.muted .cross { display: inline; }
.soundbtn.muted .waves { display: none; }
.soundbtn:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.quizpill b { color: var(--lantern); font-weight: 600; }
.quizpill:hover { background: rgba(25, 22, 48, .8); }
.quizpill:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.note .sign { font-family: var(--f-hand); font-size: 19px; line-height: 32px; margin-top: 32px; text-align: right; }
.note .sign b { display: block; font-weight: 400; font-size: 26px; color: var(--petal-deep); }
.note .photo {
  background: #fff; padding: 10px 10px 30px; margin: 4px auto 22px; width: min(100%, 280px);
  box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .35); transform: rotate(-2deg); text-align: center;
  font-family: var(--f-hand); font-size: 16px; color: var(--ink-soft);
}
.note .photo img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 40%; margin-bottom: 8px; background: #eee; }
.note .photo .empty {
  aspect-ratio: 1; margin-bottom: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #f6dde4, #e8d9f0); color: var(--ink-soft); font-family: var(--f-ui); font-size: 13px; padding: 12px;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 28px; }
.btn {
  font: 600 14px var(--f-ui); letter-spacing: .02em; cursor: pointer;
  padding: 10px 18px; border-radius: 99px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:hover { transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid var(--petal-deep); outline-offset: 2px; }
.x {
  position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: transparent; color: var(--ink-soft); font-size: 24px; line-height: 1; cursor: pointer;
}
.x:focus-visible { outline: 2px solid var(--petal-deep); }
.fade-in { animation: fadeUp .7s both; }
.quiz-progress { font: 600 12px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
.quiz-q { font-family: var(--f-hand); font-size: clamp(19px, 2.8vw, 22px); line-height: 1.4; margin: 0 0 16px; }
.opts { display: grid; gap: 10px; }
.opt {
  font: 400 17px/1.3 var(--f-hand); text-align: left; cursor: pointer; color: var(--ink);
  padding: 12px 16px; border-radius: 12px; border: 1.5px solid rgba(58, 42, 56, .25); background: rgba(255, 255, 255, .55);
  transition: background .25s, border-color .25s, transform .2s;
}
.opt:hover:not(:disabled) { border-color: var(--ink); transform: translateX(3px); }
.opt:focus-visible { outline: 3px solid var(--petal-deep); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt.right { background: #d6ecd9; border-color: #4f8a5c; }
.opt.miss { background: #f6dbe2; border-color: var(--petal-deep); }
.opt.his { border-style: dashed; border-color: #4f8a5c; }
.verdict { font-family: var(--f-hand); font-size: 18px; line-height: 1.45; margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; }
.verdict.ok { background: #e4f2e6; color: #2f5e3a; }
.verdict.no { background: #fbe7ec; color: #8c3550; }
.score { font-family: var(--f-display); font-size: 56px; line-height: 1; color: var(--petal-deep); margin: 4px 0 12px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>

<main class="scene" id="scene">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="hill" aria-hidden="true"></div>
  <div id="fireflies" aria-hidden="true"></div>

  <header class="top">
    <h1 id="headline">Hi, <em id="hername">you</em></h1>
    <p id="hint">Something has been waiting for you. Tap the gift.</p>
  </header>

  <div class="stage" id="stage">
    <!-- the gift -->
    <button class="thing gift" id="gift" style="--x:50%;--y:54%" aria-label="Open your gift">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="g-glow"><stop offset="0" stop-color="#f5d38a" stop-opacity=".9"/><stop offset="1" stop-color="#f5d38a" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse class="glow" cx="100" cy="92" rx="95" ry="70" fill="url(#g-glow)"/>
        <rect x="32" y="98" width="136" height="88" rx="6" fill="#f2a3b6"/>
        <rect x="32" y="98" width="136" height="14" fill="#d9738f" opacity=".45"/>
        <rect x="90" y="98" width="20" height="88" fill="#f5d38a"/>
        <g class="lid">
          <rect x="24" y="74" width="152" height="28" rx="5" fill="#f7b8c7"/>
          <rect x="90" y="74" width="20" height="28" fill="#f5d38a"/>
          <path d="M100 72 C 84 46, 52 50, 64 68 C 70 76, 88 74, 100 72Z" fill="#f5d38a"/>
          <path d="M100 72 C 116 46, 148 50, 136 68 C 130 76, 112 74, 100 72Z" fill="#f5d38a"/>
          <path d="M100 72 C 96 82, 88 92, 80 96 M100 72 C 104 82, 112 92, 120 96" stroke="#e9bf6a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="71" r="8" fill="#e9bf6a"/>
        </g>
        <g transform="translate(140 132) rotate(10)">
          <path d="M0 0 L32 0 L40 10 L32 20 L0 20Z" fill="#fbf3e6"/>
          <circle cx="33" cy="10" r="2.4" fill="#d9738f"/>
          <path d="M8 13 c0-7 9-7 9 0 c0-7 9-7 9 0 c0 5-9 8-9 8 s-9-3-9-8z" transform="translate(-1 -6) scale(.6) translate(10 6)" fill="#d9738f"/>
        </g>
      </svg>
      <span class="label" id="giftlabel">for you</span>
    </button>

    <!-- poem scroll -->
    <button class="thing hiddenitem" data-item="poem" style="--x:50%;--y:27%;--s:clamp(64px, 12vmin, 96px)" aria-label="A poem">
      <svg viewBox="0 0 100 100" aria-hidden="true" class="bob" style="--d:1.6s">
        <g transform="rotate(-24 50 50)">
          <rect x="14" y="38" width="72" height="24" rx="4" fill="#f3e3c3"/>
          <path d="M20 44 h56 M20 50 h48 M20 56 h52" stroke="#d8c39c" stroke-width="1.5" stroke-linecap="round"/>
          <ellipse cx="14" cy="50" rx="6" ry="12" fill="#e2cca4"/>
          <ellipse cx="14" cy="50" rx="2.5" ry="5" fill="#c9ad7e"/>
          <ellipse cx="86" cy="50" rx="6" ry="12" fill="#ead7b2"/>
          <rect x="46" y="36" width="8" height="28" fill="#d9738f"/>
        </g>
        <path d="M50 52 C 38 36, 24 44, 34 54 C 40 58, 46 55, 50 52Z" fill="#f2a3b6"/>
        <path d="M50 52 C 62 36, 76 44, 66 54 C 60 58, 54 55, 50 52Z" fill="#f2a3b6"/>
        <path d="M50 52 q-4 12 -10 20 M50 52 q4 12 10 20" stroke="#d9738f" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="52" r="4.5" fill="#d9738f"/>
      </svg>
      <span class="label">a poem</span>
    </button>

    <!-- butterflies -->
    <button class="thing hiddenitem" data-item="butterflies" style="--x:18%;--y:33%" aria-label="Butterflies">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g class="flutter">
          <g transform="translate(46 44)">
            <g class="wing l"><path d="M0 0 C-22 -30 -40 -12 -30 4 C-38 18 -16 28 0 4Z" fill="#c9a6f2"/><circle cx="-18" cy="-6" r="4" fill="#fbf3e6" opacity=".7"/></g>
            <g class="wing r"><path d="M0 0 C22 -30 40 -12 30 4 C38 18 16 28 0 4Z" fill="#b48ae8"/><circle cx="18" cy="-6" r="4" fill="#fbf3e6" opacity=".7"/></g>
            <rect x="-2" y="-12" width="4" height="22" rx="2" fill="#3a2a38"/>
            <path d="M-1 -12 q-4 -8 -8 -9 M1 -12 q4 -8 8 -9" stroke="#3a2a38" stroke-width="1.4" fill="none"/>
          </g>
        </g>
        <g class="flutter" style="animation-delay:-3s">
          <g transform="translate(78 78) scale(.55)">
            <g class="wing l" style="animation-delay:.15s"><path d="M0 0 C-22 -30 -40 -12 -30 4 C-38 18 -16 28 0 4Z" fill="#f2a3b6"/></g>
            <g class="wing r" style="animation-delay:.15s"><path d="M0 0 C22 -30 40 -12 30 4 C38 18 16 28 0 4Z" fill="#d9738f"/></g>
            <rect x="-2" y="-12" width="4" height="22" rx="2" fill="#3a2a38"/>
          </g>
        </g>
      </svg>
      <span class="label">butterflies</span>
    </button>

    <!-- jar of notes -->
    <button class="thing hiddenitem" data-item="jar" style="--x:50%;--y:84%" aria-label="A jar of little notes">
      <svg viewBox="0 0 100 100" aria-hidden="true" class="bob" style="--d:1.1s">
        <rect x="30" y="10" width="40" height="12" rx="3" fill="#c08a5a"/>
        <rect x="26" y="20" width="48" height="72" rx="12" fill="#fbf3e6" fill-opacity=".16" stroke="#fbf3e6" stroke-opacity=".55" stroke-width="2"/>
        <rect x="36" y="62" width="14" height="9" rx="2" fill="#f2a3b6" transform="rotate(-14 43 66)"/>
        <rect x="50" y="68" width="14" height="9" rx="2" fill="#f5d38a" transform="rotate(10 57 72)"/>
        <rect x="40" y="76" width="14" height="9" rx="2" fill="#c9a6f2" transform="rotate(6 47 80)"/>
        <rect x="54" y="54" width="12" height="8" rx="2" fill="#7fae8a" transform="rotate(-8 60 58)"/>
        <path d="M40 48 c0-4 6-4 6 0 c0-4 6-4 6 0 c0 4 -6 7 -6 7 s-6 -3 -6 -7z" fill="#d9738f"/>
        <path d="M34 28 q-2 22 2 50" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="label">little notes</span>
    </button>

    <!-- polaroid memory -->
    <button class="thing hiddenitem" data-item="memory" style="--x:82%;--y:33%" aria-label="A photo of a memory">
      <svg viewBox="0 0 100 100" aria-hidden="true" class="bob" style="--d:2s">
        <g transform="rotate(8 50 50)">
          <rect x="18" y="12" width="64" height="76" rx="2" fill="#fbf3e6"/>
          <rect x="24" y="18" width="52" height="50" fill="#3b2546"/>
          <circle cx="62" cy="30" r="6" fill="#f8e2a8"/>
          <path d="M24 68 L40 50 L52 60 L62 52 L76 68Z" fill="#7fae8a"/>
          <circle cx="44" cy="48" r="3" fill="#fbf3e6"/><circle cx="52" cy="48" r="3" fill="#fbf3e6"/>
          <path d="M34 78 h32" stroke="#c9b8c4" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
      <span class="label">a memory</span>
    </button>

    <!-- flowers: blue orchids and white lilies -->
    <button class="thing hiddenitem" data-item="flowers" style="--x:23%;--y:69%" aria-label="Blue orchids and white lilies">

const paras = (list) => list.map((p) => p && p.wish ? `<p class="wish"><strong>${esc(p.wish)}</strong></p>` : `<p>${esc(p)}</p>`).join("");
const ITEM_KEYS = ["butterflies", "memory", "poem", "flowers", "food", "jar"];
const state = { quizDone: false, opened: false, seen: new Set(), jarIndex: 0, lastFocus: null };

$("hername").textContent = CONFIG.herName;
document.title = "For " + CONFIG.herName;

/* note overlay */
function showNote({ kicker, title, html, extra = "", actions = [] }) {
  state.lastFocus = document.activeElement;
  $("note-kicker").textContent = kicker || "";
  $("note-title").textContent = title || "";
  $("note-body").innerHTML = html;
  $("note-extra").innerHTML = extra;
  const box = $("note-actions");
  box.innerHTML = "";
  actions.forEach((a) => {
    const b = document.createElement("button");
    b.className = "btn" + (a.primary ? " primary" : "");
    b.textContent = a.label;
    b.addEventListener("click", a.onClick);
    box.appendChild(b);
  });
  $("note").scrollTop = 0;
  $("veil").classList.add("on");
  $("veil").setAttribute("aria-hidden", "false");
  setTimeout(() => (box.querySelector(".primary") || $("close-x")).focus({ preventScroll: true }), 60);
}
let onClose = null;
function closeNote() {
  if (!$("veil").classList.contains("on")) return;
  $("veil").classList.remove("on");
  $("veil").setAttribute("aria-hidden", "true");
  if (state.lastFocus) state.lastFocus.focus({ preventScroll: true });
  const cb = onClose; onClose = null; if (cb) cb();
}
$("close-x").addEventListener("click", closeNote);
$("veil").addEventListener("click", (e) => { if (e.target === $("veil")) closeNote(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNote(); });

/* the gift */
function openLetter() {
  const L = CONFIG.letter;
  showNote({
    kicker: "A letter from " + CONFIG.yourName,
    title: L.title,
    html: `<p>${esc(L.greeting)}</p>${paras(L.paragraphs)}<div class="sign">${esc(L.signoff)}<b>${esc(CONFIG.yourName)}</b></div>`,
    actions: [{ label: "Look around", primary: true, onClick: closeNote }]
  });
}
$("gift").addEventListener("click", () => {
  if (state.quizDone) return openFinale();
  if (state.opened) return openLetter();
  state.opened = true;
  startMusic();
  $("gift").classList.add("open");
  $("gift").setAttribute("aria-label", "Read the letter again");
  $("giftlabel").textContent = "read again";
  setTimeout(() => {
    onClose = revealGarden;
    openLetter();
  }, 850);
});

function revealGarden() {
  $("hint").textContent = "Everything here has something to tell you. Tap around.";
  document.querySelectorAll(".thing.hiddenitem").forEach((el, i) => {
    setTimeout(() => el.classList.remove("hiddenitem"), 180 * i);
  });
  updateCounter();
}

/* the things in the garden */
function openItem(key) {
  const it = CONFIG.items[key];
  if (key === "poem") {
    showNote({
      kicker: it.kicker, title: it.title,
      html: (it.intro ? `<p class="poem-intro">${esc(it.intro)}</p>` : "") +
        `<div class="poem">${it.stanzas.map((st) => `<p>${st.map(esc).join("<br>")}</p>`).join("")}</div>`,
      actions: [{ label: "Close", primary: true, onClick: closeNote }]
    });
  } else if (key === "jar") {
    const n = it.notes[state.jarIndex % it.notes.length];
    showNote({
      kicker: it.kicker, title: it.title,
      html: `<p class="fade-in">${esc(n)}</p>`,
      actions: [
        { label: "Another one", primary: true, onClick: () => {
          const next = it.notes[state.jarIndex % it.notes.length];
          state.jarIndex++;
          $("note-body").innerHTML = `<p class="fade-in">${esc(next)}</p>`;
        } },
        { label: "Close", onClick: closeNote }
      ]
    });
    state.jarIndex++;
  } else {
    let extra = "";
    if (key === "memory") {
      const img = it.photo
        ? `<img src="${esc(it.photo)}" alt="${esc(it.title)}">`
        : `<div class="empty">Your photo goes here</div>`;
      extra = "";
      it._photoHtml = `<figure class="photo">${img}${esc(it.caption || "")}</figure>`;
    }
    showNote({
      kicker: it.kicker, title: it.title,
      html: (it._photoHtml || "") + paras(it.text),
      extra,
      actions: [{ label: "Close", primary: true, onClick: closeNote }]
    });
  }
  markSeen(key);
}
function startQuiz(Q, showScore) {
  let i = 0, score = 0;
  if (showScore) {
    score = state.quizScore;
    showNote({ kicker: Q.kicker, title: Q.title, html: "" });
    return finish();
  }
  showNote({ kicker: Q.kicker, title: Q.inviteTitle, html: `<p>${esc(Q.intro)}</p>`,
    actions: [{ label: "Let's play", primary: true, onClick: () => ask() }, { label: "Maybe later", onClick: closeNote }] });
  function ask() {
    $("note-title").textContent = Q.title;
    const item = Q.questions[i];
    const opts = item.options.map((o, n) => `<button class="opt" data-n="${n + 1}">${esc(o)}</button>`).join("");
    $("note-body").innerHTML = `<div class="fade-in"><p class="quiz-progress">Question ${i + 1} of ${Q.questions.length}</p>
      <p class="quiz-q">${esc(item.q)}</p><div class="opts">${opts}</div><div id="verdict"></div></div>`;
    $("note-actions").innerHTML = "";
    $("note-body").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pick(b, item)));
    const first = $("note-body").querySelector(".opt"); if (first) first.focus({ preventScroll: true });
  }
  function pick(btn, item) {
    const chosen = +btn.dataset.n, ok = chosen === item.ishan;
    if (ok) score++;
    $("note-body").querySelectorAll(".opt").forEach((b) => {
      b.disabled = true;
      if (+b.dataset.n === chosen) b.classList.add(ok ? "right" : "miss");
      else if (!ok && +b.dataset.n === item.ishan) b.classList.add("his");
    });
    const v = $("verdict");
    v.className = "verdict fade-in " + (ok ? "ok" : "no");
    v.textContent = ok ? Q.rightText : Q.missText + " (He guessed: " + item.options[item.ishan - 1] + ")";
    const last = i === Q.questions.length - 1;
    const box = $("note-actions"); box.innerHTML = "";
    const b = document.createElement("button");
    b.className = "btn primary"; b.textContent = last ? "See my score" : "Next question";
    b.addEventListener("click", () => { i++; last ? finish() : ask(); });
    box.appendChild(b); b.focus({ preventScroll: true });
  }
  function finish() {
    const t = Q.questions.length;
    if (!state.quizDone) { state.quizDone = true; onClose = updateCounter; }
    state.quizScore = score;
    $("quizpill-score").textContent = score + "/" + t;
    $("quizpill").hidden = false;
    $("note-body").innerHTML = `<div class="fade-in"><p class="score">${score}/${t}</p>
      <p class="quiz-q">${esc(Q.endTitle.replace("{score}", score).replace("{total}", t))}</p><p>${esc(Q.endText)}</p></div>`;
    const box = $("note-actions"); box.innerHTML = "";
    [["Play again", false, () => { i = 0; score = 0; ask(); }], ["Close", true, closeNote]].forEach(([l, pr, fn]) => {
      const b = document.createElement("button"); b.className = "btn" + (pr ? " primary" : ""); b.textContent = l;
      b.addEventListener("click", fn); box.appendChild(b);
    });
  }
}
$("quizpill").addEventListener("click", () => startQuiz(CONFIG.items.quiz, true));
document.querySelectorAll("[data-item]").forEach((el) => {
  el.addEventListener("click", () => openItem(el.dataset.item));
});

function markSeen(key) {
  state.seen.add(key);
  document.querySelector(`[data-item="${key}"]`).classList.add("seen");
  if (allSeen() && !state.quizDone) onClose = () => { updateCounter(); setTimeout(() => startQuiz(CONFIG.items.quiz), 450); };
  else updateCounter();
}
const allSeen = () => ITEM_KEYS.every((k) => state.seen.has(k));
function updateCounter() {
  const c = $("counter");
  c.classList.add("on");
  if (allSeen() && !state.quizDone) {
    c.innerHTML = "";
    const b = document.createElement("button");
    b.textContent = "Quiz time! Tap to play";
    b.addEventListener("click", () => startQuiz(CONFIG.items.quiz));
    c.appendChild(b);
  } else if (allSeen()) {
    c.textContent = "You found everything. The gift has one last thing for you.";
    $("gift").classList.add("final");
    $("giftlabel").textContent = "one last thing";
    $("gift").setAttribute("aria-label", "One last thing");
  } else {
    c.textContent = `${state.seen.size} of ${ITEM_KEYS.length} opened`;
  }
}
function openFinale() {
  const F = CONFIG.finale;
  showNote({
    kicker: F.kicker, title: F.title,
    html: paras(F.text) + `<div class="sign"><b>${esc(CONFIG.yourName)}</b></div>`,
    actions: [
      { label: "Read the letter again", onClick: openLetter },
      { label: "Close", primary: true, onClick: closeNote }
    ]
  });
}

/* background music: starts on the first tap, fades in, can be muted */
const song = $("song"), soundBtn = $("soundbtn");
const MUSIC_VOLUME = 0.55;
let muted = false;
function fadeTo(target, ms) {
  const start = song.volume, t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / ms);
    song.volume = start + (target - start) * k;
    if (k < 1) requestAnimationFrame(step); else if (target === 0) song.pause();
  })(t0);
}
function startMusic() {
  song.volume = 0;
  const p = song.play();
  if (p && p.then) p.then(() => fadeTo(MUSIC_VOLUME, 3000)).catch(() => {});
  soundBtn.hidden = false;
}
soundBtn.addEventListener("click", () => {
  muted = !muted;
  soundBtn.classList.toggle("muted", muted);
  soundBtn.setAttribute("aria-pressed", String(muted));
  soundBtn.setAttribute("aria-label", muted ? "Play music" : "Mute music");
  if (muted) fadeTo(0, 400);
  else { song.play().then(() => fadeTo(MUSIC_VOLUME, 800)).catch(() => {}); }
});
document.addEventListener("visibilitychange", () => {
  if (!state.opened || muted) return;
  if (document.hidden) song.pause(); else song.play().catch(() => {});
});

/* sky: stars and fireflies */
(function sky() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = $("stars"), ctx = cv.getContext("2d");
  let stars = [], w = 0, h = 0;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round((w * h) / 5200) }, () => ({
      x: Math.random() * w, y: Math.random() * h * 0.78, r: Math.random() * 1.3 + 0.3,
      p: Math.random() * Math.PI * 2, s: 0.6 + Math.random() * 1.4
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      const a = reduce ? 0.7 : 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p));
      ctx.globalAlpha = a; ctx.fillStyle = "#fbf3e6";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", () => { size(); if (reduce) draw(0); });
  reduce ? draw(0) : requestAnimationFrame(draw);

  const ff = $("fireflies");
  for (let i = 0; i < 14; i++) {
    const d = document.createElement("span");
    d.className = "firefly";
    d.style.left = Math.random() * 100 + "%";
    d.style.top = 45 + Math.random() * 50 + "%";
    d.style.animationDelay = (-Math.random() * 9) + "s";
    d.style.animationDuration = (7 + Math.random() * 6) + "s";
    ff.appendChild(d);
  }
})();
</script>
